<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abasto Express</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e293b',
                        secondary: '#0f172a',
                        accent: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- BARRA SUPERIOR -->
    <div class="bg-secondary text-white text-xs sm:text-sm py-2 px-4 shadow-inner">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-store text-accent"></i>
                <span class="font-medium">¡Bienvenidos a Abasto Express! Delivery local rápido y seguro.</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1.5 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                    <span class="text-slate-400">Tasa BCV:</span>
                    <span id="top-rate-display" class="font-bold text-accent">45.50</span> Bs/$
                </div>
                <button onclick="openAdminModal()" class="hover:text-accent transition flex items-center gap-1">
                    <i class="fa-solid fa-lock text-xs"></i> Admin
                </button>
            </div>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="filterCategory('Todos')">
                <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center text-white text-2xl shadow-md">
                    <i class="fa-solid fa-basket-shopping"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-primary tracking-tight">ABASTO EXPRESS</h1>
                    <p class="text-xs text-slate-500 font-medium">Tu tienda virtual de confianza</p>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- SECCIÓN DE CARGA Y PRODUCTOS -->
        <div id="loading-spinner" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-accent mb-4"></div>
            <p class="text-slate-500 text-sm font-medium">Cargando inventario y precios...</p>
        </div>

        <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Los productos se cargan dinámicamente desde Firebase -->
        </div>
    </main>

    <!-- MODAL MODO ADMIN -->
    <div id="admin-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden">
            <div class="p-5 bg-secondary text-white flex items-center justify-between">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-lock text-accent mr-2"></i> Panel de Administración</h3>
                <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow">
                <p class="text-slate-600">Panel de control de inventario y configuración de Abasto Express.</p>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONFIGURACIÓN Y FUNCIONES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDDVvmv4IMKVqw4dTEVuKfRddkmZHvTozU",
            authDomain: "abasto-express-revenga.firebaseapp.com",
            databaseURL: "https://abasto-express-revenga-default-rtdb.firebaseio.com",
            projectId: "abasto-express-revenga",
            storageBucket: "abasto-express-revenga.firebasestorage.app",
            messagingSenderId: "949998603525",
            appId: "1:949998603525:web:3d17f8878cec631291bb6c",
            measurementId: "G-FTGBP8J3YH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        async function initApp() {
            try {
                const configRef = ref(db, 'config');
                const snapshot = await get(configRef);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.bcvRate) {
                        document.getElementById('top-rate-display').innerText = data.bcvRate;
                    }
                }
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('products-container').classList.remove('hidden');
            } catch (error) {
                console.error("Error al conectar con Firebase:", error);
            }
        }

        initApp();
    </script>

    <script>
        function openAdminModal() {
            const pin = prompt("Ingresa la contraseña de administración:");
            if (pin === "Abasto2026*") {
                const modal = document.getElementById('admin-modal');
                if (modal) modal.classList.remove('hidden');
            } else if (pin !== null) {
                alert("Contraseña incorrecta");
            }
        }
        window.openAdminModal = openAdminModal;
    </script>
</body>
</html>
