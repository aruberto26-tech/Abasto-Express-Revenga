<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abasto Express</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e293b',
                        secondary: '#0f172a',
                        accent: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- BARRA SUPERIOR -->
    <div class="bg-secondary text-white text-xs sm:text-sm py-2 px-4 shadow-inner">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-store text-accent"></i>
                <span class="font-medium">¡Bienvenidos a Abasto Express! Delivery local rápido y seguro.</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1.5 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                    <span class="text-slate-400">Tasa BCV:</span>
                    <span id="top-rate-display" class="font-bold text-accent">45.50</span> Bs/$
                </div>
                <button onclick="openClientModal()" id="top-client-btn" class="hover:text-accent transition flex items-center gap-1">
                    <i class="fa-solid fa-user-circle"></i> <span id="client-btn-text">Cliente Fijo</span>
                </button>
                <button onclick="openAdminModal()" class="hover:text-accent transition flex items-center gap-1">
                    <i class="fa-solid fa-lock text-xs"></i> Admin
                </button>
            </div>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="filterCategory('Todos')">
                <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center text-white text-2xl shadow-md">
                    <i class="fa-solid fa-basket-shopping"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-primary tracking-tight">ABASTO EXPRESS</h1>
                    <p class="text-xs text-slate-500 font-medium">Tu tienda virtual de confianza</p>
                </div>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="relative flex-grow sm:w-80">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar productos..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent text-sm">
                </div>
                <button onclick="openCartModal()" class="relative bg-primary hover:bg-slate-800 text-white p-2.5 rounded-xl transition shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-accent text-slate-900 text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="loading-spinner" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-accent mb-4"></div>
            <p class="text-slate-500 text-sm font-medium">Cargando inventario y precios...</p>
        </div>

        <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Productos dinámicos -->
        </div>
    </main>

    <!-- MODAL MODO ADMIN -->
    <div id="admin-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-3xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden">
            <div class="p-5 bg-secondary text-white flex items-center justify-between">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-lock text-accent mr-2"></i> Panel de Administración Completo</h3>
                <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <!-- PESTAÑAS DEL PANEL ADMIN -->
            <div class="flex border-b border-slate-200 bg-slate-100 px-6 gap-4">
                <button onclick="switchAdminTab('config')" id="tab-btn-config" class="py-3 px-4 font-bold text-sm border-b-2 border-accent text-primary">Configuración</button>
                <button onclick="switchAdminTab('inventory')" id="tab-btn-inventory" class="py-3 px-4 font-semibold text-sm text-slate-500 hover:text-primary">Inventario</button>
                <button onclick="switchAdminTab('sales')" id="tab-btn-sales" class="py-3 px-4 font-semibold text-sm text-slate-500 hover:text-primary">Ventas</button>
            </div>

            <div class="p-6 overflow-y-auto flex-grow space-y-6">
                <!-- SECCIÓN 1: CONFIGURACIÓN -->
                <div id="admin-tab-config" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tasa del Dólar BCV (Bs/$)</label>
                            <div class="flex gap-2">
                                <input type="number" id="admin-rate-input" step="0.01" class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="Ej: 45.50">
                                <button onclick="saveAdminRate()" class="bg-primary text-white px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-800">Guardar</button>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">WhatsApp de Pedidos</label>
                            <div class="flex gap-2">
                                <input type="text" id="admin-phone-input" class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="Ej: 584125551234">
                                <button onclick="saveAdminPhone()" class="bg-primary text-white px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-800">Guardar</button>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nueva Contraseña Admin</label>
                            <div class="flex gap-2">
                                <input type="password" id="admin-pass-input" class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="Nueva clave">
                                <button onclick="saveAdminPassword()" class="bg-primary text-white px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-800">Cambiar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN 2: INVENTARIO -->
                <div id="admin-tab-inventory" class="space-y-4 hidden">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                        <h4 class="font-bold text-slate-700 mb-3"><i class="fa-solid fa-plus-circle text-accent mr-1"></i> Agregar / Editar Producto</h4>
                        <input type="hidden" id="edit-prod-id">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                            <input type="text" id="prod-name" placeholder="Nombre del producto" class="px-3 py-2 border rounded-xl text-sm">
                            <input type="number" id="prod-price" step="0.01" placeholder="Precio en USD ($)" class="px-3 py-2 border rounded-xl text-sm">
                            <input type="text" id="prod-category" placeholder="Categoría" class="px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <button onclick="saveProduct()" class="bg-accent text-slate-900 font-bold px-5 py-2 rounded-xl text-sm hover:opacity-90">Guardar Producto</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-b">
                                    <th class="p-3">Producto</th>
                                    <th class="p-3">Categoría</th>
                                    <th class="p-3">Precio</th>
                                    <th class="p-3 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="admin-inventory-table">
                                <!-- Inventario dinámico -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- SECCIÓN 3: VENTAS -->
                <div id="admin-tab-sales" class="space-y-4 hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-b">
                                    <th class="p-3">Fecha / ID</th>
                                    <th class="p-3">Cliente</th>
                                    <th class="p-3">Total ($)</th>
                                    <th class="p-3">Detalle</th>
                                </tr>
                            </thead>
                            <tbody id="admin-sales-table">
                                <!-- Ventas dinámicas -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE FIREBASE Y LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDDVvmv4IMKVqw4dTEVuKfRddkmZHvTozU",
            authDomain: "abasto-express-revenga.firebaseapp.com",
            databaseURL: "https://abasto-express-revenga-default-rtdb.firebaseio.com",
            projectId: "abasto-express-revenga",
            storageBucket: "abasto-express-revenga.firebasestorage.app",
            messagingSenderId: "949998603525",
            appId: "1:949998603525:web:3d17f8878cec631291bb6c",
            measurementId: "G-FTGBP8J3YH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
        window.ref = ref;
        window.get = get;
        window.set = set;
        window.push = push;
        window.remove = remove;

        let currentAdminPin = "Abasto2026*";
        let whatsappNumber = "584125551234";

        async function initApp() {
            try {
                const configRef = ref(db, 'config');
                const snapshot = await get(configRef);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.bcvRate) {
                        document.getElementById('top-rate-display').innerText = data.bcvRate;
                        document.getElementById('admin-rate-input').value = data.bcvRate;
                    }
                    if (data.adminPin) currentAdminPin = data.adminPin;
                    if (data.whatsappPhone) {
                        whatsappNumber = data.whatsappPhone;
                        document.getElementById('admin-phone-input').value = whatsappNumber;
                    }
                }
                window.currentAdminPin = currentAdminPin;
                loadProducts();
                loadSales();
            } catch (error) {
                console.error("Error al conectar con Firebase:", error);
            }
        }

        async function loadProducts() {
            const productsRef = ref(db, 'products');
            const prodSnapshot = await get(productsRef);
            const container = document.getElementById('products-container');
            const tableBody = document.getElementById('admin-inventory-table');
            container.innerHTML = '';
            tableBody.innerHTML = '';

            if (prodSnapshot.exists()) {
                const products = prodSnapshot.val();
                Object.keys(products).forEach(key => {
                    const p = products[key];
                    container.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800">${p.name}</h3>
                                <p class="text-xs text-slate-500 mb-2">${p.category || 'General'}</p>
                                <p class="text-accent font-black text-lg">$${p.price}</p>
                            </div>
                            <button onclick="alert('Pedido vía WhatsApp al número ${whatsappNumber}')" class="mt-4 w-full bg-slate-100 hover:bg-primary hover:text-white text-slate-700 py-2 rounded-xl text-sm font-semibold transition">Pedir por WhatsApp</button>
                        </div>
                    `;
                    tableBody.innerHTML += `
                        <tr class="border-b hover:bg-slate-50">
                            <td class="p-3 font-medium">${p.name}</td>
                            <td class="p-3 text-slate-500">${p.category || 'General'}</td>
                            <td class="p-3 font-bold text-accent">$${p.price}</td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="deleteProduct('${key}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                container.innerHTML = '<p class="text-slate-500 col-span-full text-center py-10">No hay productos registrados.</p>';
                tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">No hay productos en inventario.</td></tr>';
            }
            document.getElementById('loading-spinner').classList.add('hidden');
            container.classList.remove('hidden');
        }

        async function loadSales() {
            const salesRef = ref(db, 'sales');
            const salesSnapshot = await get(salesRef);
            const salesTable = document.getElementById('admin-sales-table');
            salesTable.innerHTML = '';

            if (salesSnapshot.exists()) {
                const sales = salesSnapshot.val();
                Object.keys(sales).forEach(key => {
                    const s = sales[key];
                    salesTable.innerHTML += `
                        <tr class="border-b hover:bg-slate-50">
                            <td class="p-3 text-xs text-slate-500">${s.date || key}</td>
                            <td class="p-3 font-medium">${s.client || 'Cliente General'}</td>
                            <td class="p-3 font-bold text-accent">$${s.total || '0.00'}</td>
                            <td class="p-3 text-xs text-slate-600">${s.items || 'Compra web'}</td>
                        </tr>
                    `;
                });
            } else {
                salesTable.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">No hay ventas registradas aún.</td></tr>';
            }
        }

        window.loadProducts = loadProducts;
        window.loadSales = loadSales;
        initApp();
    </script>

    <script>
        function openAdminModal() {
            const pin = prompt("Ingresa la contraseña de administración:");
            if (pin === (window.currentAdminPin || "Abasto2026*")) {
                const modal = document.getElementById('admin-modal');
                if (modal) modal.classList.remove('hidden');
            } else if (pin !== null) {
                alert("Contraseña incorrecta");
            }
        }

        function switchAdminTab(tab) {
            document.getElementById('admin-tab-config').classList.add('hidden');
            document.getElementById('admin-tab-inventory').classList.add('hidden');
            document.getElementById('admin-tab-sales').classList.add('hidden');
            
            document.getElementById('tab-btn-config').className = "py-3 px-4 font-semibold text-sm text-slate-500 hover:text-primary";
            document.getElementById('tab-btn-inventory').className = "py-3 px-4 font-semibold text-sm text-slate-500 hover:text-primary";
            document.getElementById('tab-btn-sales').className = "py-3 px-4 font-semibold text-sm text-slate-500 hover:text-primary";

            document.getElementById(`admin-tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).className = "py-3 px-4 font-bold text-sm border-b-2 border-accent text-primary";
        }

        async function saveAdminRate() {
            const newRate = document.getElementById('admin-rate-input').value;
            if(!newRate) return alert("Ingresa una tasa válida");
            try {
                await window.set(window.ref(window.db, 'config/bcvRate'), newRate);
                document.getElementById('top-rate-display').innerText = newRate;
                alert("¡Tasa BCV actualizada con éxito!");
            } catch (e) { alert("Error al guardar"); }
        }

        async function saveAdminPhone() {
            const newPhone = document.getElementById('admin-phone-input').value;
            if(!newPhone) return alert("Ingresa un número válido");
            try {
                await window.set(window.ref(window.db, 'config/whatsappPhone'), newPhone);
                alert("¡Número de WhatsApp actualizado con éxito!");
            } catch (e) { alert("Error al guardar"); }
        }

        async function saveAdminPassword() {
            const newPass = document.getElementById('admin-pass-input').value;
            if(!newPass) return alert("Ingresa una contraseña válida");
            try {
                await window.set(window.ref(window.db, 'config/adminPin'), newPass);
                window.currentAdminPin = newPass;
                document.getElementById('admin-pass-input').value = '';
                alert("¡Contraseña de administrador actualizada con éxito!");
            } catch (e) { alert("Error al guardar"); }
        }

        async function saveProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const category = document.getElementById('prod-category').value;

            if(!name || !price) return alert("Completa al menos el nombre y el precio");
            try {
                const newProdRef = window.push(window.ref(window.db, 'products'));
                await window.set(newProdRef, { name, price, category: category || 'General' });
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-category').value = '';
                alert("¡Producto guardado con éxito!");
                window.loadProducts();
            } catch (e) { alert("Error al guardar producto"); }
        }

        async function deleteProduct(key) {
            if(confirm("¿Estás seguro de eliminar este producto?")) {
                try {
                    await window.remove(window.ref(window.db, `products/${key}`));
                    window.loadProducts();
                } catch (e) { alert("Error al eliminar"); }
            }
        }

        function openClientModal() { alert("Módulo de cliente fijo"); }
        function openCartModal() { alert("Carrito de compras"); }
        function filterCategory(cat) {}
        function filterProducts() {}

        window.openAdminModal = openAdminModal;
        window.switchAdminTab = switchAdminTab;
        window.saveAdminRate = saveAdminRate;
        window.saveAdminPhone = saveAdminPhone;
        window.saveAdminPassword = saveAdminPassword;
        window.saveProduct = saveProduct;
        window.deleteProduct = deleteProduct;
        window.openClientModal = openClientModal;
        window.openCartModal = openCartModal;
    </script>
</body>
</html>
